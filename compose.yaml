name: financial-rag

services:
  api:
    build: { context: ., target: python-runtime }
    command: [uvicorn, "app.main:app", --host, 0.0.0.0, --port, "8000", --workers, "1",
              --proxy-headers, --forwarded-allow-ips=*, --timeout-keep-alive, "30"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
      FALLBAFCK_GROQ_API_KEY: ${FALLBACK_GROQ_API_KEY:-}
      CHAT_API_KEYS: ${CHAT_API_KEYS:?Set CHAT_API_KEYS}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-60}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      # QDRANT_STORAGE_PATH: /app/data/qdrant_storage
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      REQUEST_TIMEOUT_S: "40"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      # - ./data/qdrant_storage:/app/data/qdrant_storage
      - ./data/manifests:/app/data/manifests
      - model_cache:/home/app/.cache
    depends_on:
      redis: { condition: service_healthy }
    networks: [proxy_api, api_backend]
    mem_limit: 5g
    cpus: 4
    restart: unless-stopped
    init: true
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  redis:
    image: redis/redis-stack-server:7.4.0-v2
    command: [sh, -c, 'exec redis-stack-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy volatile-lru']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis_data:/data]
    networks: [api_backend]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  nginx:
    build: { context: ., target: production }
    environment:
      CHAT_API_KEY: ${WEB_API_KEY:?Set WEB_API_KEY}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/secrets/admin.htpasswd:/etc/nginx/auth/admin.htpasswd:ro
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_started, required: false }
    networks: [proxy_api, proxy_admin]
    mem_limit: 128m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  # --- server mode only (docker compose --profile server up): needs the api switched to QDRANT_URL ---
  admin:
    profiles: ["server"]   #profiles: ["admin"]   
    build: { context: ., target: python-runtime }
    command: [streamlit, run, admin/app.py, --server.address=0.0.0.0, --server.port=8501,
              --server.baseUrlPath=admin, --server.enableCORS=false,
              --server.enableXsrfProtection=true, --browser.gatherUsageStats=false]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      STREAMLIT_SERVER_HEADLESS: "true"
    volumes:
      - ./data/manifests:/app/data/manifests
      - admin_uploads:/app/data/temp_uploads
      - model_cache:/home/app/.cache
    networks: [proxy_admin, admin_backend]
    mem_limit: 3g
    restart: unless-stopped

  qdrant:
    profiles: ["server"]
    image: qdrant/qdrant:v1.13.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
    volumes: [qdrant_data:/qdrant/storage]
    networks: [api_backend, admin_backend]
    restart: unless-stopped

networks:
  proxy_api:
  proxy_admin:
  api_backend: { internal: true }
  admin_backend: { internal: true }

volumes:
  admin_uploads:
  model_cache:
  qdrant_data:
  redis_data: