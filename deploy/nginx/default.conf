map $http_upgrade $connection_upgrade { default upgrade; '' close; }

limit_req_zone  $binary_remote_addr zone=chat_per_ip:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=admin_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
resolver 127.0.0.11 valid=10s ipv6=off;

upstream financial_rag_api {
    zone financial_rag_api 64k;
    least_conn;
    server api:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}
upstream financial_rag_admin {
    zone financial_rag_admin 64k;
    server admin:8501 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    limit_conn connections_per_ip 20;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;
    proxy_http_version 1.1;

    location = /health       { proxy_set_header Host $host; proxy_pass http://financial_rag_api/health; }
    location = /health/ready { proxy_set_header Host $host; proxy_pass http://financial_rag_api/health/ready; }

    location = /v1/chat {
        limit_except POST { deny all; }
        limit_req zone=chat_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header X-API-Key "${CHAT_API_KEY}";
        proxy_connect_timeout 10s;
        proxy_send_timeout 50s;
        proxy_read_timeout 55s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://financial_rag_api/v1/chat;
    }

    location = /admin { return 308 /admin/; }

    location ^~ /admin/ {
        client_max_body_size 32m;
        limit_req zone=admin_per_ip burst=10 nodelay;
        limit_req_status 429;
        auth_basic "Financial RAG Admin";
        auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://financial_rag_admin/admin/;
    }

    location /assets/ { expires 1y; try_files $uri =404; }
    location /        { try_files $uri $uri/ /index.html; }
}