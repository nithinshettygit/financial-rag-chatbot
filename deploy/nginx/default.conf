map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Streamlit loads many assets at once; do not rate-limit or concurrency-count them.
map $uri $admin_rate_limit_key {
    ~^/admin/static/ "";
    default $binary_remote_addr;
}
limit_req_zone $admin_rate_limit_key zone=admin_per_ip:10m rate=5r/s;
limit_conn_zone $admin_rate_limit_key zone=connections_per_ip:10m;

# valid=30s: re-resolve every 30 s instead of 10 s to reduce DNS churn on
# low-CPU hosts.  127.0.0.11 is Docker's embedded DNS server.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream financial_rag_api {
    zone financial_rag_api 64k;
    least_conn;
    server api:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# Resolve the admin service lazily so Nginx can start before it is healthy.

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    limit_conn connections_per_ip 20;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;
    proxy_http_version 1.1;

    location = /health {
        proxy_set_header Host $host;
        proxy_pass http://financial_rag_api/health;
    }

    location = /health/ready {
        proxy_set_header Host $host;
        proxy_pass http://financial_rag_api/health/ready;
    }

    location = /v1/chat {
        limit_except POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # No shared API key is injected or expected. Authentication is based on
        # the signed HttpOnly browser session cookie handled by FastAPI.
        # Do not proxy-retry POST /v1/chat: a retry can duplicate expensive RAG work.
        # Timeouts are intentionally generous for a low-CPU prototype host:
        # REQUEST_TIMEOUT_S=120 s in FastAPI + a 20 s safety margin so the
        # backend always fires its own 504 JSON response before nginx does.
        proxy_connect_timeout 15s;
        proxy_send_timeout    145s;
        proxy_read_timeout    145s;
        proxy_pass http://financial_rag_api/v1/chat;
    }

    location = /admin { return 308 /admin/; }

    location ^~ /admin/ {
        client_max_body_size 32m;
        limit_req zone=admin_per_ip burst=10 nodelay;
        limit_req_status 429;
        auth_basic "Financial RAG Admin";
        auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Preserve the complete Streamlit base path and endpoint URI.
        set $admin_upstream http://admin:8501;
        proxy_pass $admin_upstream$request_uri;
    }

    location /assets/ { expires 1y; try_files $uri =404; }
    location /        { try_files $uri $uri/ /index.html; }
}
