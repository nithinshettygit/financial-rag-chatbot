# Version-controlled non-secret defaults shared by the API and admin UI.

# Application and vector-store identity
APP_NAME: "Docling Financial Hybrid RAG Service"
LLM_MODEL: "openai/gpt-oss-20b"
EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
VECTOR_NAME: "fastembed-BAAI-bge-small-en-v1-5"
EMBEDDING_DIMENSIONS: 384
COLLECTION_NAME: "financial_rag_analytics"
# Set QDRANT_URL through the deployment environment.
QDRANT_URL: null
QDRANT_STORAGE_PATH: "data/qdrant_storage"
REDIS_URL: "redis://localhost:6379"
DATA_DIR: "data"
TEMP_UPLOAD_DIR: "temp_uploads"
PROMPTS_PATH: "prompts"

# Browser sessions and request admission
SESSION_TTL_SECONDS: 86400
SESSION_COOKIE_SECURE: true
SESSION_COOKIE_SAMESITE: "lax"
CHAT_SESSION_RATE_LIMIT_REQUESTS: 20
CHAT_IP_RATE_LIMIT_REQUESTS: 60
CHAT_RATE_LIMIT_WINDOW_SECONDS: 60
MAX_CONCURRENT_RAG: 1
MAX_QUEUE_WAITERS: 10
RAG_QUEUE_MAX_WAIT_SECONDS: 15
RAG_QUEUE_POLL_INTERVAL_SECONDS: 0.25
RAG_QUEUE_RETRY_AFTER_SECONDS: 2
RAG_CONCURRENCY_LEASE_SECONDS: 60
REQUEST_TIMEOUT_S: 80

# Model calls and retrieval
LLM_MAX_ATTEMPTS: 4
LLM_MAX_WAIT_S: 25
LLM_REASONING_EFFORT: null
BM25_MANIFEST_PATH: "data/manifests"
MANIFEST_METADATA_SUBDIR: "metadata"
RETRIEVAL_K: 30
RERANK_CANDIDATES: 30
FINAL_TOP_K: 5
MAX_FINAL_TOP_K: 10
MIN_STRICT_YIELD: 5
RRF_K: 60
MAX_HISTORY_TURNS: 6
MAX_CONTEXT_TOKENS: 4096
CATALOG_TTL_S: 300
MAX_CONCURRENT_SEARCHES: 8
MAX_SUB_QUERIES: 12
RERANKER_MODEL: "rerank-3-lite"
RERANKER_TIMEOUT_S: 20
FASTEMBED_CACHE_DIR: null
FASTEMBED_LOCAL_FILES_ONLY: false

# Response cache
CACHE_TTL: 86400
CACHE_GREETING_TTL: 604800
CACHE_MAX_DISTANCE: 0.04
CACHE_MIN_TERM_OVERLAP: 0.7

# Guardrails and intent routing
GUARDRAILS_ENABLED: true
GUARDRAILS_PATH: "app/guardrails_config"
GUARDRAIL_LLM_MODEL: "openai/gpt-oss-20b"
GUARDRAILS_TIMEOUT_S: 15
GUARDRAILS_FAIL_OPEN: false
GUARDRAILS_NUMERIC_CHECK: true
MAX_INPUT_CHARS: 2000

INTENT_ROUTER_ENABLED: true
INTENT_EXAMPLES_PATH: "app/data/intent_examples.yml"
INTENT_MIN_SCORE: 0.85
INTENT_MIN_MARGIN: 0.03
MAX_WORDS_SHORT: 12
MAX_WORDS_ANY: 40

# PII and document ingestion
PII_ENGINE: "presidio"
PII_SPACY_MODEL: "en_core_web_sm"
PII_SCORE_THRESHOLD: 0.4
PII_INPUT_ENTITIES:
  - PHONE_NUMBER
  - EMAIL_ADDRESS
  - CREDIT_CARD
  - US_SSN
  - IBAN_CODE
  - IP_ADDRESS
  - US_BANK_NUMBER
  - US_PASSPORT
  - US_DRIVER_LICENSE
  - IN_AADHAAR
  - IN_PAN
PII_OUTPUT_ENTITIES:
  - EMAIL_ADDRESS
  - CREDIT_CARD
  - US_SSN
  - IBAN_CODE
  - US_BANK_NUMBER
  - IN_AADHAAR
  - IN_PAN

MAX_EMBEDDING_TOKENS: 500
MIN_TEXT_CHARS: 35
MIN_TEXT_WORDS: 6
OCR_FALLBACK_MISSING_PAGE_RATIO: 0.2
